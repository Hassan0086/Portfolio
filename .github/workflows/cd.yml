name: Continuous Deployment

on:
  workflow_run:
    workflows:
      - Continuous Integration
    types:
      - completed

permissions:
  contents: read

jobs:
  deploy:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'

    runs-on: ubuntu-latest

    steps:
      - name: Trigger Vercel Deployment
        run: |
          if [ -n "${{ secrets.VERCEL_DEPLOY_HOOK }}" ]; then
            echo "Triggering Vercel deploy hook..."
            curl -s -X POST "${{ secrets.VERCEL_DEPLOY_HOOK }}"
            echo "Vercel deployment hook triggered successfully."
          else
            echo "VERCEL_DEPLOY_HOOK secret is not configured. Please add it in your repository secrets."
          fi

      - name: Deployment Completed
        run: echo "Deployment trigger step completed."
